name: Market Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh static market data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild market index
        env:
          MARKET_INDEX_MIN_PAIRS: 3500
        run: npm run build:market-index

      - name: Rebuild hot-pair candles
        env:
          MARKET_CANDLE_PAIR_LIMIT: 100
          MARKET_CANDLE_PAIR_CONCURRENCY: 6
        run: npm run build:market-candles

      - name: Typecheck
        run: npx tsc -b

      - name: Commit refreshed market data
        run: |
          git add public/market/index.json public/market/candles

          if git diff --cached --quiet; then
            echo "No market data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh market data"
          git pull --rebase origin main
          git push origin HEAD:main
