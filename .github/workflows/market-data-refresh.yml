name: Market Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh static market data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild market index
        env:
          MARKET_INDEX_MIN_PAIRS: 1000
        run: npm run build:market-index

      - name: Rebuild hot-pair candles
        env:
          MARKET_CANDLE_PAIR_LIMIT: 100
          MARKET_CANDLE_PAIR_CONCURRENCY: 6
        run: npm run build:market-candles

      - name: Typecheck
        run: npx tsc -b

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/refresh-market-data
          delete-branch: true
          title: "Refresh market data"
          commit-message: "Refresh market data"
          body: |
            Automated refresh of Terra Classic market index and hot-pair candle data.

            This PR is generated by the scheduled market data workflow.
