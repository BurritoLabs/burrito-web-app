name: Frontend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend.yml"

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production dependency audit
        run: npm run check:audit

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile product regression
        run: npm run test:e2e
