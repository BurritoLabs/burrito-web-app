    <title>Burrito | Terra &amp; Terra Classic</title>
    <script>
      (() => {
        const key = "burrito:theme"
        let saved = null
        try { saved = localStorage.getItem(key) } catch (_) {}
        if (saved !== "light" && saved !== "dark" && saved !== "system") {
          try { saved = sessionStorage.getItem(key) } catch (_) {}
        }
        const preference = saved === "light" || saved === "dark" || saved === "system" ? saved : "system"
        const theme = preference === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : preference
        const root = document.documentElement
        root.dataset.themePreference = preference
        root.dataset.theme = theme
        root.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#070D0B" : "#F5F8F5")
      })()
    </script>
    <style>
      :root {
        --boot-bg: #070d0b;
        --boot-card: #0b1411;
        --boot-border: rgba(225, 247, 233, 0.105);
        --boot-green: #52c41a;
        --boot-text: #eaf5eb;
        --boot-top: rgba(11, 20, 17, 0.88);
        --boot-shimmer: rgba(234, 245, 235, 0.14);
      }

      :root[data-theme="light"] {
        --boot-bg: #f5f8f5;
        --boot-card: #ffffff;
        --boot-border: rgba(43, 78, 57, 0.12);
        --boot-text: #142019;
        --boot-top: rgba(255, 255, 255, 0.9);
        --boot-shimmer: rgba(20, 32, 25, 0.12);
      }

      .boot-shell {
        min-height: 100vh;
        background:
          radial-gradient(900px 520px at 70% 12%, rgba(104, 216, 63, 0.1), transparent 64%),
          linear-gradient(180deg, var(--boot-card) 0%, var(--boot-bg) 100%);
        color: var(--boot-text);
        font-family: Montserrat, system-ui, sans-serif;
      }

      .boot-top {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid var(--boot-border);
        background: var(--boot-top);
      }

      .boot-brand,
      .boot-pill {
        border-radius: 999px;
        background: var(--boot-border);
      }

      .boot-brand {
        width: 118px;
        height: 24px;
      }

      .boot-pill {
        width: 126px;
        height: 34px;
        border: 1px solid rgba(104, 216, 63, 0.35);
      }

      .boot-main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 40px 0;
        display: grid;
        gap: 18px;
      }

      .boot-title {
        width: 220px;
        height: 42px;
        border-radius: 999px;
        background: var(--boot-border);
      }

      .boot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .boot-card {
        min-height: 118px;
        border-radius: 8px;
        border: 1px solid var(--boot-border);
        background: var(--boot-card);
        padding: 20px;
        display: grid;
        align-content: start;
        gap: 12px;
      }

      .boot-line,
      .boot-value {
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-border);
      }

      .boot-line {
        width: 46%;
        height: 12px;
      }

      .boot-value {
        width: 78%;
        height: 24px;
      }

      .boot-line::after,
      .boot-value::after,
      .boot-brand::after,
      .boot-title::after,
      .boot-pill::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--boot-shimmer), transparent);
        animation: boot-shimmer 1.5s ease-in-out infinite;
      }

      .boot-brand,
      .boot-title,
      .boot-pill {
        position: relative;
        overflow: hidden;
      }

      @keyframes boot-shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @media (max-width: 640px) {
        .boot-top {
          padding: 0 18px;
        }

        .boot-main {
          width: calc(100% - 32px);
          padding: 28px 0;
        }

        .boot-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-label="Loading Burrito">
        <div class="boot-top">
          <div class="boot-brand"></div>
          <div class="boot-pill"></div>
        </div>
        <main class="boot-main">
          <div class="boot-title"></div>
          <section class="boot-grid">
            <div class="boot-card">
              <span class="boot-line"></span>
              <span class="boot-value"></span>
            </div>
            <div class="boot-card">
              <span class="boot-line"></span>
              <span class="boot-value"></span>
            </div>
            <div class="boot-card">
              <span class="boot-line"></span>
              <span class="boot-value"></span>
            </div>
            <div class="boot-card">
              <span class="boot-line"></span>
              <span class="boot-value"></span>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
